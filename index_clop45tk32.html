<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色格式轉換工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* Textarea and output styling */
        textarea, .output-box {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        }
        
        /* Toast animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-exit {
            animation: slideOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-800 to-gray-900 min-h-screen text-gray-100">
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span id="toastMessage">已複製到剪貼簿</span>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
                角色格式轉換工具
            </h1>
            <p class="text-gray-400 mt-2">將角色資料轉換為指定格式</p>
        </header>

        <!-- Tab Navigation -->
        <div class="flex mb-6 bg-gray-800 rounded-xl p-1 shadow-lg">
            <button id="tab1Btn" onclick="switchTab(1)" 
                class="flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                <span class="hidden sm:inline">自訂輸入角色</span>
                <span class="sm:hidden">自訂輸入</span>
            </button>
            <button id="tab2Btn" onclick="switchTab(2)" 
                class="flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
                </svg>
                <span class="hidden sm:inline">挑選資料庫角色</span>
                <span class="sm:hidden">資料庫</span>
            </button>
        </div>

        <!-- Page 1: Custom Input -->
        <div id="page1" class="space-y-6">
            <div class="bg-gray-800/50 backdrop-blur rounded-2xl p-6 shadow-xl border border-gray-700/50">
                <!-- Character Name Input -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-cyan-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        角色名稱
                    </label>
                    <input type="text" id="charName" 
                        class="w-full bg-gray-900/50 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                        placeholder="請輸入角色名稱..."
                        oninput="updateOutput()">
                </div>

                <!-- Character Traits Input -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-cyan-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        角色特性
                    </label>
                    <textarea id="charTraits" rows="8"
                        class="w-full bg-gray-900/50 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all resize-none custom-scroll"
                        placeholder="請輸入角色特性描述（約400字）..."
                        oninput="updateOutput()"></textarea>
                    <div class="text-right text-xs text-gray-500 mt-1">
                        <span id="charCount">0</span> 字
                    </div>
                </div>

                <!-- Output Display -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-purple-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        轉換結果
                    </label>
                    <div id="output1" 
                        class="output-box w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-gray-300 min-h-[200px] max-h-[300px] overflow-y-auto custom-scroll whitespace-pre-wrap break-words font-mono text-sm">
                        <span class="text-gray-500 italic">轉換結果將顯示於此...</span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="copyOutput(1)" 
                        class="flex-1 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-medium py-3 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-emerald-500/25">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        複製內容
                    </button>
                    <button onclick="clearAll()" 
                        class="flex-1 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-medium py-3 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-red-500/25">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                        完全清空
                    </button>
                </div>
            </div>
        </div>

        <!-- Page 2: Database Selection -->
        <div id="page2" class="space-y-6 hidden">
            <div class="bg-gray-800/50 backdrop-blur rounded-2xl p-6 shadow-xl border border-gray-700/50">
                <!-- Google Sheets URL Config -->
                <div class="mb-5 p-4 bg-gray-900/50 rounded-xl border border-dashed border-gray-600">
                    <label class="block text-sm font-medium text-amber-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Google Sheets 設定
                    </label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="sheetId" 
                            class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm"
                            placeholder="輸入 Google Sheets ID...">
                        <button onclick="loadFromSheet()" 
                            class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-medium py-2 px-4 rounded-lg transition-all flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            載入資料
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">
                        💡 請確保試算表已公開發佈（檔案 → 分享 → 發布到網路）
                    </p>
                </div>

                <!-- Search Input -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-cyan-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        搜尋角色
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" 
                            class="flex-1 bg-gray-900/50 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all"
                            placeholder="輸入角色名稱進行模糊搜尋..."
                            onkeyup="handleSearchKeyup(event)">
                        <button onclick="searchCharacter()" 
                            class="bg-cyan-500 hover:bg-cyan-600 text-white p-3 rounded-xl transition-all flex items-center justify-center shadow-lg hover:shadow-cyan-500/25">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Character Select -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-cyan-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                        選擇角色
                        <span id="charCountLabel" class="text-gray-500 text-xs font-normal">(共 0 個角色)</span>
                    </label>
                    <select id="charSelect" 
                        class="w-full bg-gray-900/50 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all cursor-pointer"
                        onchange="selectCharacter()">
                        <option value="">-- 請先載入資料庫 --</option>
                    </select>
                </div>

                <!-- Output Display -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-purple-400 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        轉換結果
                    </label>
                    <div id="output2" 
                        class="output-box w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-gray-300 min-h-[200px] max-h-[300px] overflow-y-auto custom-scroll whitespace-pre-wrap break-words font-mono text-sm">
                        <span class="text-gray-500 italic">請選擇角色以顯示轉換結果...</span>
                    </div>
                </div>

                <!-- Copy Button -->
                <button onclick="copyOutput(2)" 
                    class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-medium py-3 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-emerald-500/25">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    複製內容
                </button>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-40">
                <div class="bg-gray-800 rounded-2xl p-8 flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-gray-300">正在載入資料...</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-gray-500 text-sm mt-8 pb-4">
            <p>角色格式轉換工具 © 2024</p>
        </footer>
    </div>

    <script>
        // Global variables
        let databaseCharacters = [];
        let filteredCharacters = [];

        // Tab switching
        function switchTab(tabNum) {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const tab1Btn = document.getElementById('tab1Btn');
            const tab2Btn = document.getElementById('tab2Btn');

            if (tabNum === 1) {
                page1.classList.remove('hidden');
                page2.classList.add('hidden');
                tab1Btn.className = 'flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-md';
                tab2Btn.className = 'flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200';
            } else {
                page1.classList.add('hidden');
                page2.classList.remove('hidden');
                tab1Btn.className = 'flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200';
                tab2Btn.className = 'flex-1 py-3 px-4 rounded-lg font-medium transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-500 text-white shadow-md';
            }
        }

        // Format conversion function
        function formatCharacter(name, traits) {
            if (!name.trim()) return '';
            return `<${name}>
角色名稱: "${name}"
角色特性: "
${traits.trim()}
"
</${name}>`;
        }

        // Page 1: Update output on input
        function updateOutput() {
            const name = document.getElementById('charName').value;
            const traits = document.getElementById('charTraits').value;
            const output = document.getElementById('output1');
            const charCount = document.getElementById('charCount');

            charCount.textContent = traits.length;

            if (name.trim() || traits.trim()) {
                output.textContent = formatCharacter(name, traits);
                output.classList.remove('text-gray-500', 'italic');
            } else {
                output.innerHTML = '<span class="text-gray-500 italic">轉換結果將顯示於此...</span>';
            }
        }

        // Page 1: Clear all inputs
        function clearAll() {
            document.getElementById('charName').value = '';
            document.getElementById('charTraits').value = '';
            document.getElementById('charCount').textContent = '0';
            document.getElementById('output1').innerHTML = '<span class="text-gray-500 italic">轉換結果將顯示於此...</span>';
            showToast('已清空所有內容');
        }

        // Copy output to clipboard
        async function copyOutput(pageNum) {
            const output = document.getElementById(`output${pageNum}`);
            const text = output.textContent;

            if (!text || text.includes('轉換結果將顯示於此') || text.includes('請選擇角色')) {
                showToast('沒有可複製的內容', 'warning');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showToast('已複製到剪貼簿');
            } catch (err) {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已複製到剪貼簿');
            }
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastDiv = toast.querySelector('div');

            toastMessage.textContent = message;
            
            if (type === 'warning') {
                toastDiv.className = 'bg-amber-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2';
            } else if (type === 'error') {
                toastDiv.className = 'bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2';
            } else {
                toastDiv.className = 'bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2';
            }

            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('toast-exit');
                }, 300);
            }, 2000);
        }

        // Page 2: Load data from Google Sheets
        async function loadFromSheet() {
            const sheetId = document.getElementById('sheetId').value.trim();
            
            if (!sheetId) {
                showToast('請輸入 Google Sheets ID', 'warning');
                return;
            }

            const loadingIndicator = document.getElementById('loadingIndicator');
            loadingIndicator.classList.remove('hidden');

            try {
                // Using Google Sheets published CSV format
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
                
                const response = await fetch(url);
                const text = await response.text();
                
                // Parse Google's JSONP-like response
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
                if (!jsonMatch) {
                    throw new Error('無法解析回應格式');
                }
                
                const data = JSON.parse(jsonMatch[1]);
                const rows = data.table.rows;
                
                databaseCharacters = [];
                
                // Skip header row if exists, process data rows
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.c && row.c[0] && row.c[1]) {
                        const id = row.c[0].v?.toString() || '';
                        const name = row.c[1].v?.toString() || '';
                        const traits = row.c[2]?.v?.toString() || '';
                        
                        // Skip if it looks like a header
                        if (id.toLowerCase().includes('編號') || name.toLowerCase().includes('名稱')) {
                            continue;
                        }
                        
                        if (id && name) {
                            databaseCharacters.push({ id, name, traits });
                        }
                    }
                }

                filteredCharacters = [...databaseCharacters];
                updateSelect();
                showToast(`成功載入 ${databaseCharacters.length} 個角色`);
                
            } catch (error) {
                console.error('載入失敗:', error);
                showToast('載入失敗，請確認 Sheets ID 和權限設定', 'error');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // Update select options
        function updateSelect() {
            const select = document.getElementById('charSelect');
            const countLabel = document.getElementById('charCountLabel');
            
            select.innerHTML = '';
            
            if (filteredCharacters.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '-- 沒有找到符合的角色 --';
                select.appendChild(option);
                countLabel.textContent = '(共 0 個角色)';
                return;
            }

            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- 請選擇角色 --';
            select.appendChild(defaultOption);

            filteredCharacters.forEach((char, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `[${char.id}] ${char.name}`;
                select.appendChild(option);
            });

            countLabel.textContent = `(共 ${filteredCharacters.length} 個角色)`;
        }

        // Handle search on Enter key
        function handleSearchKeyup(event) {
            if (event.key === 'Enter') {
                searchCharacter();
            }
        }

        // Page 2: Search character
        function searchCharacter() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!searchTerm) {
                filteredCharacters = [...databaseCharacters];
            } else {
                filteredCharacters = databaseCharacters.filter(char => 
                    char.name.toLowerCase().includes(searchTerm) ||
                    char.id.toLowerCase().includes(searchTerm)
                );
            }

            updateSelect();
            
            // Clear output when search changes
            document.getElementById('output2').innerHTML = '<span class="text-gray-500 italic">請選擇角色以顯示轉換結果...</span>';
            
            if (searchTerm && filteredCharacters.length === 0) {
                showToast('沒有找到符合的角色', 'warning');
            } else if (searchTerm) {
                showToast(`找到 ${filteredCharacters.length} 個符合的角色`);
            }
        }

        // Page 2: Select character and show output
        function selectCharacter() {
            const select = document.getElementById('charSelect');
            const output = document.getElementById('output2');
            const selectedIndex = select.value;

            if (selectedIndex === '' || filteredCharacters.length === 0) {
                output.innerHTML = '<span class="text-gray-500 italic">請選擇角色以顯示轉換結果...</span>';
                return;
            }

            const char = filteredCharacters[parseInt(selectedIndex)];
            if (char) {
                output.textContent = formatCharacter(char.name, char.traits);
                output.classList.remove('text-gray-500', 'italic');
            }
        }

        function loadDemoData() {

                { id: '0003', name: '白朱熙', traits: '溫柔善良的治癒師，總是為他人著想。擁有強大的治癒能力，是團隊中不可或缺的存在。' },
                { id: '0004', name: '韓佑鎮', traits: '熱血正義的劍士，為人正直且富有正義感。雖然有時衝動，但對同伴極為忠誠。' },
                { id: '0005', name: '李智雅', traits: '聰明機智的策略家，擅長分析局勢並制定計畫。外表冷酷但內心溫暖。' }
            ];
            filteredCharacters = [...databaseCharacters];

        }

        // Add demo button after page loads
        document.addEventListener('DOMContentLoaded', function() {
            const configDiv = document.querySelector('#page2 .bg-gray-900\\/50.rounded-xl.border-dashed');
            const demoBtn = document.createElement('button');
            demoBtn.onclick = loadDemoData;
            demoBtn.className = 'mt-2 text-xs text-cyan-400 hover:text-cyan-300 underline';
            demoBtn.textContent = '📋 載入示範資料（測試用）';
            configDiv.appendChild(demoBtn);
        });
    </script>
</body>
